<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI Assistant</title>
<link rel="stylesheet" href="face.css">
</head>
<body>

  <main class="scene" id="scene">
    <div class="face" id="face" data-state="starting">

      <div class="eyes" id="eyes">
        <div class="eye" id="eyeLeft"><div class="eye-fill"></div></div>
        <div class="eye" id="eyeRight"><div class="eye-fill"></div></div>
      </div>

      <div class="mouth-wrap">
        <canvas id="mouthCanvas"></canvas>
      </div>

    </div>
  </main>

  <script src="face.js"></script>
</body>
</html>
