<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="c.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIA - Scheme Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Back button */
        .back-btn {
            position: absolute;
            top: 28px;
            left: 28px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 18px;

            border: 1px solid #0b5d4b;
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.9);
            color: #0b5d4b;

            font-size: 16px;
            font-weight: 600;
            text-decoration: none;

            opacity: 0;
            animation: backFade 0.7s ease forwards;
            animation-delay: 0.15s;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back-btn:hover {
            background: #0b5d4b;
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Empty message */
        .empty-message {
            font-size: 28px;
            font-weight: 500;
            color: #777777;

            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }

        /* Message fade-in */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 0.55;
                transform: translateY(0);
            }
        }

        /* Back button fade-in */
        @keyframes backFade {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .back-btn {
                top: 20px;
                left: 20px;
                padding: 8px 15px;
                font-size: 14px;
            }

            .empty-message {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <a href="/" class="back-btn">
        ← Back
    </a>

    <div class="empty-message">
        No recent messages
    </div>

</body>
</html>
