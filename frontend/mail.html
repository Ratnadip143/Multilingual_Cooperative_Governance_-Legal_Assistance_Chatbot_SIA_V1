<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIA - Messages</title>

    <link rel="stylesheet" href="/static/mail.css?v=4">

    <style>
        /* Back to Home button */
        .back-home {
            padding: 8px 16px;
            border: 1px solid #ffffff;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-home:hover {
            background: #ffffff;
            color: #2e7d32;
        }

        /* Empty Messages state */
        .empty-state {
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
        }

        /* Message bubble icon */
        .empty-icon {
            font-size: 72px;
            line-height: 1;
            opacity: 0.18;
            animation: emptyFade 1.2s ease forwards;
        }

        /* Empty message text */
        .empty-text {
            font-size: 26px;
            font-weight: 500;
            color: #777777;
            opacity: 0;
            animation: emptyFade 1.2s ease forwards;
            animation-delay: 0.15s;
        }

        @keyframes emptyFade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .empty-icon {
                font-size: 60px;
            }

            .empty-text {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="inbox-container">

        <header class="inbox-header">

            <div class="header-title">
                <svg width="24" height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>

                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>

                <h1>Messages</h1>
            </div>

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </header>

        <main class="message-list">

            <div class="empty-state">
                <div class="empty-icon">💬</div>

                <div class="empty-text">
                    No recent messages
                </div>
            </div>

        </main>

    </div>

</body>
</html>
